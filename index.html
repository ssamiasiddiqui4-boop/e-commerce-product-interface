<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe Market | E-Commerce Product Interface — Samia Iftikhar</title>
  <meta name="description" content="A modern e-commerce storefront built with HTML, CSS and JavaScript: product catalog, search, filters and a shopping cart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grain"></span>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap bar">
      <a href="https://ssamiasiddiqui4-boop.github.io/portfolio/" class="brand">Luxe Market</a>
      <p class="tagline">An e-commerce interface &middot; Auspify internship, Task 5</p>
      <button type="button" class="cart-btn" id="cart-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="cart-drawer">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4h2l2.4 12.2a2 2 0 002 1.8h8.2a2 2 0 002-1.6L21 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="visually-hidden">Open cart</span>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="shop-wrap">
      <div class="wrap">

        <div class="controls glass">
          <label class="visually-hidden" for="search-input">Search products</label>
          <input type="text" id="search-input" placeholder="Search products&hellip;" autocomplete="off">

          <label class="visually-hidden" for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="rating-desc">Rating: High to low</option>
          </select>
        </div>

        <div class="filter-row" role="group" aria-label="Filter by category" id="category-filters"></div>

        <p class="result-count" id="result-count" aria-live="polite"></p>

        <ul class="product-grid" id="product-grid"></ul>

        <p class="no-results" id="no-results" hidden>No products match your search and filters.</p>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-bar">
      <p>&copy; <span id="year">2026</span> Samia Iftikhar. A demo storefront &mdash; no real payments are processed.</p>
      <a class="text-link" href="https://ssamiasiddiqui4-boop.github.io/portfolio/" target="_blank" rel="noopener">Back to portfolio</a>
    </div>
  </footer>

  <!-- Cart drawer -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" hidden>
    <div class="cart-head">
      <h2>Your cart</h2>
      <button type="button" class="icon-btn" id="cart-close" aria-label="Close cart">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <ul class="cart-items" id="cart-items"></ul>
    <p class="cart-empty" id="cart-empty">Your cart is empty.</p>

    <div class="cart-foot">
      <div class="cart-subtotal">
        <span>Subtotal</span>
        <strong id="cart-subtotal">$0.00</strong>
      </div>
      <button type="button" class="btn btn-primary cart-checkout" id="checkout-btn">Checkout</button>
      <p class="cart-note" id="checkout-note" aria-live="polite"></p>
    </div>
  </aside>

  <!-- Templates -->
  <template id="product-card-template">
    <li class="product glass shine">
      <div class="thumb" aria-hidden="true">
        <span class="thumb-emoji"></span>
      </div>
      <div class="product-body">
        <p class="product-category"></p>
        <h3 class="product-name"></h3>
        <p class="rating"><span class="stars"></span><span class="rating-count"></span></p>
        <div class="product-foot">
          <span class="price"></span>
          <button type="button" class="btn btn-primary add-btn">Add to cart</button>
          <div class="qty-stepper" hidden>
            <button type="button" class="qty-btn qty-minus" aria-label="Decrease quantity">&minus;</button>
            <span class="qty-value">1</span>
            <button type="button" class="qty-btn qty-plus" aria-label="Increase quantity">+</button>
          </div>
        </div>
      </div>
    </li>
  </template>

  <template id="cart-item-template">
    <li class="cart-item">
      <div class="thumb cart-thumb" aria-hidden="true"><span class="thumb-emoji"></span></div>
      <div class="cart-item-body">
        <p class="cart-item-name"></p>
        <p class="cart-item-price"></p>
        <div class="qty-stepper">
          <button type="button" class="qty-btn qty-minus" aria-label="Decrease quantity">&minus;</button>
          <span class="qty-value">1</span>
          <button type="button" class="qty-btn qty-plus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button type="button" class="icon-btn remove-btn" aria-label="Remove item">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 7h12M9 7V5h6v2M8 7l1 13h6l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </li>
  </template>

  <script src="js/script.js"></script>
</body>
</html>
